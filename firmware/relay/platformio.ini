; Each firmware image is one file in src/apps/. Shared modules (lora/, ble/, ...)
; are compiled into every env; only the selected app's setup()/loop() is linked.
;
;   pio run -e lora-ping -t upload     LoRa-to-LoRa serial ping test
;   pio run -e bridge -t upload        BLE <-> LoRa bridge (NEYRA-LORA)
;   pio run                            build every env

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	jgromes/RadioLib@^7.1.2

[env:lora-ping]
build_src_filter = +<lora/> +<apps/lora_ping.cpp>

[env:bridge]
lib_deps =
	${env.lib_deps}
	h2zero/NimBLE-Arduino@^2.1.0
build_src_filter = +<*> -<apps/> +<apps/bridge_main.cpp>
