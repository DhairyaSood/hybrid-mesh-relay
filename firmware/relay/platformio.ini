; Each firmware image is one file in src/apps/; each env compiles only what it needs.
;
;   pio run -e lora-ping -t upload     LoRa-to-LoRa serial ping test
;   pio run -e bridge -t upload        BLE <-> LoRa bridge (NEYRA-LORA)
;   pio run -e radiodiag -t upload     RA-02 wiring diagnostic (never transmits)
;   pio run                            build all firmware images
;   pio test -e native                 host unit tests (no board needed)
;
; Easier: scripts/flash.sh <env> [port]  or  scripts\flash.ps1 <env> [port]

[platformio]
default_envs = lora-ping, bridge, radiodiag

[esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	jgromes/RadioLib@^7.1.2

[env:lora-ping]
extends = esp32
build_src_filter = +<lora/> +<apps/lora_ping.cpp>

[env:bridge]
extends = esp32
lib_deps =
	${esp32.lib_deps}
	h2zero/NimBLE-Arduino@^2.1.0
build_src_filter = +<*> -<apps/> +<apps/bridge_main.cpp>

[env:radiodiag]
extends = esp32
lib_deps =
build_src_filter = +<apps/radio_diag.cpp>

[env:native]
platform = native
build_src_filter = +<routing/DedupCache.cpp>
build_flags = -std=c++17 -I src
test_build_src = yes
